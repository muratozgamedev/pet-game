<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 Pet Game - Giriş</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>🐾 Pet Game</h1>
    <p class="subtitle">Yumurtlat, besle, mutasyon geçir, efsane ol!</p>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Kullanıcı adın" maxlength="15" autocomplete="off">
      <input type="password" id="password" placeholder="Şifren (en az 6 karakter)">
      <button type="submit">🚀 Oyuna Gir</button>
    </form>
    <div id="msg" class="msg"></div>
    <p class="hint">Hesabın yoksa otomatik oluşturulur 😉</p>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
